<!DOCTYPE html>
<html lang="en">
<head>
 <title>TESTING LIVE VERSION</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arabic Daily</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #1a1a2e; --blue: #2563eb; --blue-light: #eff6ff;
    --green: #16a34a; --dot-green: #22c55e; --dot-blue: #3b82f6;
    --dot-red: #ef4444; --dot-yellow: #eab308; --grey: #6b7280;
    --grey-light: #f3f4f6; --border: #e5e7eb; --card-radius: 16px;
    --sidebar-w: 220px;
  }
   { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f4ff; color: var(--ink); min-height: 100vh; }

  /* LOGIN */
  #login-screen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; background: linear-gradient(160deg, #1a1a2e 0%, #2563eb 100%); }
  .login-logo { width: 64px; height: 64px; background: white; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 28px; margin-bottom: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
  .login-title { color: white; font-size: 28px; font-weight: 700; margin-bottom: 6px; }
  .login-subtitle { color: rgba(255,255,255,0.6); font-size: 14px; margin-bottom: 40px; }
  .login-card { background: white; border-radius: var(--card-radius); padding: 28px; width: 100%; max-width: 360px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
  .login-card label { display: block; font-size: 13px; font-weight: 600; color: var(--grey); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
  .login-card input { width: 100%; padding: 14px 16px; border: 2px solid var(--border); border-radius: 10px; font-size: 18px; letter-spacing: 4px; text-align: center; font-weight: 700; color: var(--ink); outline: none; transition: border-color 0.2s; text-transform: uppercase; }
  .login-card input:focus { border-color: var(--blue); }
  .login-btn { width: 100%; margin-top: 16px; padding: 14px; background: var(--blue); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; }
  .login-btn:hover { background: #1d4ed8; }
  .login-error { color: #ef4444; font-size: 13px; margin-top: 10px; text-align: center; display: none; }

  /* APP */
  #app { display: none; min-height: 100vh; }

  /* SIDEBAR */
  #sidebar { width: var(--sidebar-w); min-width: var(--sidebar-w); background: var(--ink); min-height: 100vh; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow: hidden; transition: width 0.25s, min-width 0.25s; }
  #sidebar.collapsed { width: 0; min-width: 0; }
  .sidebar-logo { display: flex; align-items: center; gap: 10px; padding: 20px 16px 16px; border-bottom: 1px solid rgba(255,255,255,0.1); white-space: nowrap; }
  .sidebar-logo-icon { width: 32px; height: 32px; background: var(--blue); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
  .sidebar-logo-text { color: white; font-size: 14px; font-weight: 700; }
  .sidebar-label { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: rgba(255,255,255,0.35); padding: 16px 16px 8px; white-space: nowrap; }
  .sidebar-students { flex: 1; overflow-y: auto; padding: 0 8px 16px; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.1) transparent; }
  .sidebar-student { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 10px; cursor: pointer; transition: background 0.15s; margin-bottom: 2px; white-space: nowrap; }
  .sidebar-student:hover { background: rgba(255,255,255,0.08); }
  .sidebar-student.active { background: rgba(255,255,255,0.15); }
  .sidebar-avatar { width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: white; flex-shrink: 0; }
  .sidebar-info { flex: 1; overflow: hidden; }
  .sidebar-name { color: white; font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
  .sidebar-streak { color: rgba(255,255,255,0.5); font-size: 11px; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .status-dot.green { background: var(--dot-green); }
  .status-dot.red { background: var(--dot-red); }
  .status-dot.grey { background: rgba(255,255,255,0.2); }
  .sidebar-bottom { padding: 12px 8px; border-top: 1px solid rgba(255,255,255,0.1); white-space: nowrap; }
  .sidebar-view-btn { width: 100%; padding: 9px 12px; background: rgba(255,255,255,0.1); border: none; border-radius: 8px; color: rgba(255,255,255,0.7); font-size: 12px; font-weight: 600; cursor: pointer; transition: background 0.2s; text-align: left; }
  .sidebar-view-btn:hover { background: rgba(255,255,255,0.18); }

  /* MAIN */
  #main { flex: 1; overflow-y: auto; min-width: 0; }

  /* HEADER */
  .header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; background: white; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; gap: 12px; }
  .header-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .sidebar-toggle { width: 36px; height: 36px; border: none; background: var(--grey-light); border-radius: 10px; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .header-icon { width: 36px; height: 36px; background: var(--blue); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
  .header-title { font-size: 17px; font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .header-sub { font-size: 12px; color: var(--grey); }
  .view-toggle { padding: 7px 14px; background: var(--grey-light); border: none; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--grey); cursor: pointer; flex-shrink: 0; }

  /* TABS */
  .tabs { display: flex; background: white; border-bottom: 1px solid var(--border); padding: 0 20px; }
  .tab { padding: 14px 18px; font-size: 14px; font-weight: 600; color: var(--grey); border: none; background: none; cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.2s; }
  .tab.active { color: var(--blue); border-bottom-color: var(--blue); }

  /* CONTENT */
  .content { padding: 20px; max-width: 600px; }
  .section-label { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--grey); margin-bottom: 12px; }

  /* STREAK CARD */
  .streak-card { background: var(--ink); border-radius: var(--card-radius); padding: 20px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; }
  .streak-left { display: flex; align-items: center; gap: 14px; }
  .streak-flame { font-size: 36px; }
  .streak-count { font-size: 32px; font-weight: 800; color: white; line-height: 1; }
  .streak-label { font-size: 13px; color: rgba(255,255,255,0.6); margin-top: 2px; }
  .streak-rank { text-align: right; }
  .streak-rank-num { font-size: 22px; font-weight: 700; color: white; }
  .streak-rank-label { font-size: 12px; color: rgba(255,255,255,0.5); }

  /* BANNER */
  .banner { border-radius: var(--card-radius); padding: 16px 18px; margin-bottom: 20px; display: flex; align-items: flex-start; gap: 12px; }
  .banner.yellow { background: #fefce8; border: 1.5px solid #fde047; }
  .banner.red { background: #fef2f2; border: 1.5px solid #fca5a5; }
  .banner-icon { font-size: 22px; flex-shrink: 0; }
  .banner-title { font-size: 14px; font-weight: 700; color: var(--ink); margin-bottom: 3px; }
  .banner-sub { font-size: 13px; color: var(--grey); }

  /* CALENDAR */
  .calendar-card { background: white; border-radius: var(--card-radius); padding: 20px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .cal-nav-btn { width: 32px; height: 32px; border: none; background: none; font-size: 18px; cursor: pointer; color: var(--grey); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
  .cal-nav-btn:hover { background: var(--grey-light); }
  .cal-month { font-size: 16px; font-weight: 700; direction: rtl; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal-day-header { text-align: center; font-size: 11px; color: var(--grey); font-weight: 600; padding: 4px 0 8px; direction: rtl; }
  .cal-day { display: flex; flex-direction: column; align-items: center; padding: 6px 2px; border-radius: 10px; cursor: pointer; transition: background 0.15s; min-height: 52px; }
  .cal-day:hover:not(.other-month) { background: var(--grey-light); }
  .cal-day.today .day-num { background: var(--blue-light); color: var(--blue); font-weight: 700; border-radius: 8px; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; }
  .cal-day.selected { background: var(--grey-light); }
  .cal-day.selected .day-num { color: var(--ink); font-weight: 700; }
  .cal-day.selected.sel-green { background: #dcfce7; }
  .cal-day.selected.sel-green .day-num { color: var(--green); }
  .cal-day.selected.sel-yellow { background: #fef9c3; }
  .cal-day.selected.sel-yellow .day-num { color: #854d0e; }
  .cal-day.selected.sel-blue { background: var(--blue-light); }
  .cal-day.selected.sel-blue .day-num { color: var(--blue); }
  .day-num { font-size: 14px; color: var(--ink); width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; }
  .other-month .day-num { color: var(--border); }

  /* Activity squares instead of dots */
  .dots { display: flex; gap: 2px; margin-top: 3px; height: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .dot { width: 7px; height: 7px; border-radius: 2px; flex-shrink: 0; }
  .dot-green { background: var(--dot-green); }
  .dot-blue { background: var(--dot-blue); }
  .dot-yellow { background: var(--dot-yellow); }
  /* Flashcard activity square */
  .dot-fc { background: #8b5cf6; }

  .cal-legend { display: flex; gap: 12px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--grey); }
  .legend-sq { width: 10px; height: 10px; border-radius: 2px; }

  /* DAY CARD */
  .day-card { border-radius: var(--card-radius); padding: 20px; margin-bottom: 20px; background: var(--grey-light); color: var(--ink); }
  .day-card.card-green { background: #16a34a; color: white; }
  .day-card.card-yellow { background: #ca8a04; color: white; }
  .day-card.card-blue { background: var(--blue); color: white; }
  .day-card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 8px; }
  .day-badge { background: rgba(0,0,0,0.1); border-radius: 20px; padding: 4px 10px; font-size: 12px; font-weight: 600; }
  .day-card.card-green .day-badge, .day-card.card-yellow .day-badge, .day-card.card-blue .day-badge { background: rgba(255,255,255,0.2); }
  .day-status { font-size: 13px; opacity: 0.85; }
  .day-date { font-size: 22px; font-weight: 700; line-height: 1.2; }
  .review-btn { padding: 10px 18px; border-radius: 10px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .review-btn.reviewed { background: rgba(255,255,255,0.25); color: white; }
  .review-btn.not-reviewed { background: white; color: var(--blue); }

  /* SUBMISSIONS */
  .submissions-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 16px; }
  .submission-thumb { border-radius: 12px; overflow: hidden; position: relative; background: var(--grey-light); aspect-ratio: 3/4; cursor: pointer; }
  .submission-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .submission-badge { position: absolute; top: 8px; left: 8px; color: white; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
  .submission-badge.reviewed-badge { background: var(--blue); }
  .submission-badge.uploaded-badge { background: var(--green); }
  .submission-badge.makeup-badge { background: var(--dot-yellow); color: #1a1a2e; }

  /* TEXT SUBMISSION */
  .text-submission { background: white; border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1.5px solid var(--border); }
  .text-submission-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--grey); margin-bottom: 8px; }
  .text-submission-content { font-size: 15px; color: var(--ink); line-height: 1.6; direction: auto; }

  /* UPLOAD */
  .upload-section { background: white; border-radius: var(--card-radius); padding: 20px; margin-bottom: 20px; border: 1.5px solid var(--border); }
  .upload-section-title { font-size: 14px; font-weight: 700; color: var(--ink); margin-bottom: 16px; }
  .upload-area { border: 2px dashed var(--border); border-radius: 12px; padding: 24px; text-align: center; cursor: pointer; transition: all 0.2s; margin-bottom: 12px; }
  .upload-area:hover { border-color: var(--blue); background: var(--blue-light); }
  .upload-icon { font-size: 28px; margin-bottom: 6px; }
  .upload-title { font-size: 14px; font-weight: 600; color: var(--ink); margin-bottom: 2px; }
  .upload-sub { font-size: 12px; color: var(--grey); }
  #file-input { display: none; }
  .text-input-wrap textarea { width: 100%; padding: 12px 14px; border: 2px solid var(--border); border-radius: 10px; font-size: 15px; color: var(--ink); resize: vertical; min-height: 100px; outline: none; font-family: inherit; transition: border-color 0.2s; direction: auto; }
  .text-input-wrap textarea:focus { border-color: var(--blue); }
  .submit-btn { width: 100%; margin-top: 12px; padding: 14px; background: var(--blue); color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .submit-btn:disabled { background: var(--grey); cursor: not-allowed; }

  /* ── FLASHCARDS ── */
  .fc-lesson-picker { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .fc-lesson-btn { padding: 8px 16px; border-radius: 20px; border: 2px solid var(--border); background: white; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--grey); transition: all 0.2s; }
  .fc-lesson-btn.active { background: var(--blue); border-color: var(--blue); color: white; }

  .fc-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
  .fc-stat { background: white; border-radius: 12px; padding: 14px; text-align: center; }
  .fc-stat-num { font-size: 22px; font-weight: 800; color: var(--ink); }
  .fc-stat-label { font-size: 11px; color: var(--grey); margin-top: 2px; }

  /* TIMER PANEL */
  .fc-timer-panel { background: white; border-radius: var(--card-radius); padding: 20px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .fc-timer-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .fc-timer-display { font-size: 36px; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: 2px; min-width: 90px; }
  .fc-timer-display.running { color: var(--green); }
  .fc-timer-display.done { color: var(--dot-red); }
  .fc-timer-controls { display: flex; gap: 8px; align-items: center; }
  .fc-timer-btn { padding: 10px 18px; border-radius: 10px; border: none; font-size: 14px; font-weight: 700; cursor: pointer; transition: opacity 0.2s; }
  .fc-timer-start { background: var(--green); color: white; }
  .fc-timer-stop { background: #fee2e2; color: #b91c1c; }
  .fc-timer-reset { background: var(--grey-light); color: var(--grey); }
  .fc-timer-goal { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
  .fc-timer-goal label { font-size: 12px; color: var(--grey); font-weight: 600; white-space: nowrap; }
  .fc-timer-goal input[type=range] { flex: 1; accent-color: var(--blue); }
  .fc-timer-goal-val { font-size: 13px; font-weight: 700; color: var(--blue); min-width: 32px; text-align: right; }
  .fc-session-result { margin-top: 14px; padding: 12px 14px; background: #f0fdf4; border-radius: 10px; font-size: 14px; font-weight: 600; color: var(--green); display: none; }

  .fc-card-wrap { perspective: 1000px; margin-bottom: 20px; }
  .fc-card { background: white; border-radius: var(--card-radius); padding: 48px 28px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.08); min-height: 220px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.15s; position: relative; }
  .fc-card:active { transform: scale(0.98); }
  .fc-arabic { font-size: 42px; font-weight: 700; color: var(--ink); line-height: 1.3; direction: rtl; margin-bottom: 8px; }
  .fc-tap-hint { font-size: 13px; color: var(--grey); margin-top: 16px; }
  .fc-english { font-size: 22px; font-weight: 600; color: var(--blue); margin-top: 12px; display: none; }
  .fc-card.revealed .fc-english { display: block; }
  .fc-card.revealed .fc-tap-hint { display: none; }

  /* Delete button on card */
  .fc-delete-btn { position: absolute; top: 12px; right: 12px; width: 28px; height: 28px; border-radius: 50%; border: none; background: #fee2e2; color: #b91c1c; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: 0.6; transition: opacity 0.2s; }
  .fc-delete-btn:hover { opacity: 1; }

  .fc-rating-wrap { display: none; gap: 8px; margin-bottom: 20px; }
  .fc-rating-wrap.visible { display: flex; }
  .fc-rating-btn { flex: 1; padding: 12px 4px; border: none; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer; transition: opacity 0.2s; }
  .fc-rating-btn:hover { opacity: 0.85; }
  .fc-r1 { background: #fef2f2; color: #b91c1c; }
  .fc-r2 { background: #fff7ed; color: #c2410c; }
  .fc-r3 { background: #fefce8; color: #854d0e; }
  .fc-r4 { background: #f0fdf4; color: #15803d; }
  .fc-r5 { background: #eff6ff; color: #1d4ed8; }

  .fc-done { background: white; border-radius: var(--card-radius); padding: 40px 28px; text-align: center; margin-bottom: 20px; }
  .fc-done-icon { font-size: 48px; margin-bottom: 12px; }
  .fc-done-title { font-size: 20px; font-weight: 700; color: var(--ink); margin-bottom: 6px; }
  .fc-done-sub { font-size: 14px; color: var(--grey); margin-bottom: 20px; }
  .fc-restart-btn { padding: 12px 24px; background: var(--blue); color: white; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; }

  /* ADD CARD */
  .fc-add-section { background: white; border-radius: var(--card-radius); padding: 20px; margin-bottom: 20px; border: 1.5px dashed var(--border); }
  .fc-add-section h3 { font-size: 14px; font-weight: 700; color: var(--ink); margin-bottom: 14px; }
  .fc-add-row { display: flex; gap: 10px; align-items: flex-end; }
  .fc-add-field { flex: 1; }
  .fc-add-field label { display: block; font-size: 11px; font-weight: 600; color: var(--grey); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .fc-add-field input { width: 100%; padding: 10px 12px; border: 2px solid var(--border); border-radius: 8px; font-size: 15px; color: var(--ink); outline: none; font-family: inherit; transition: border-color 0.2s; }
  .fc-add-field input:focus { border-color: var(--blue); }
  .fc-add-field input[dir=rtl] { direction: rtl; font-size: 18px; }
  .fc-add-submit { padding: 10px 16px; background: var(--blue); color: white; border: none; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }

  /* MODAL */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
  .modal-overlay.open { display: flex; }
  .modal-img { max-width: 100%; max-height: 80vh; border-radius: 12px; object-fit: contain; }
  .modal-close { position: absolute; top: 16px; right: 16px; background: white; border: none; border-radius: 50%; width: 36px; height: 36px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

  /* TOAST */
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--ink); color: white; padding: 12px 20px; border-radius: 10px; font-size: 14px; font-weight: 600; z-index: 200; transition: transform 0.3s; white-space: nowrap; }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .no-submission-msg { background: white; border-radius: var(--card-radius); padding: 20px; text-align: center; color: var(--grey); font-size: 14px; margin-bottom: 20px; }
  .locked-msg { background: #fef2f2; border-radius: var(--card-radius); padding: 16px; text-align: center; color: #b91c1c; font-size: 14px; margin-bottom: 20px; border: 1.5px solid #fca5a5; }
</style>
</head>

</script>

<div id="login-screen">
  <div class="login-logo">🕌</div>
  <div class="login-title">Arabic Daily</div>
  <div class="login-subtitle">Daily homework tracker</div>
  <div class="login-card">
    <label>Your code</label>
    <input type="text" id="code-input" maxlength="6" placeholder="ABC123" autocomplete="off">
    <div class="login-error" id="login-error">Code not recognised. Try again.</div>
    <button class="login-btn" id="login-btn">Enter</button>
  </div>
</div>

<div id="app">
  <div id="sidebar" style="display:none">
    <div class="sidebar-logo">
      <div class="sidebar-logo-icon">🕌</div>
      <div class="sidebar-logo-text">Arabic Daily</div>
    </div>
    <div class="sidebar-label">Students</div>

// ── UTILS ──
function dateKey(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function todayKey() { return dateKey(new Date()); }
function formatDateLong(key) { const [y,m,d]=key.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString('en-GB',{weekday:'long',year:'numeric',month:'long',day:'numeric'}); }
function activeStudentCode() { return isInstructor && !isStudentView ? viewingStudent : currentUser; }

function isMidnightPast(dateStr) {
  const [y,m,d] = dateStr.split('-').map(Number);
  return new Date() > new Date(y, m-1, d+1, 0, 0, 0);
}

function getMissedDays(code) {
  const subs = submissions[code] || {};
  const missed = [], now = new Date();
  const allKeys = Object.keys(subs).sort();
  if (!allKeys.length) return [];
  const firstSubmission = allKeys[0];
  for (let i = 1; i <= 60; i++) {
    const d = new Date(now); d.setDate(now.getDate() - i);
    const key = dateKey(d);
    if (key < firstSubmission) break;
    if (isMidnightPast(key) && (!subs[key] || (!subs[key].images?.length && !subs[key].text))) missed.push(key);
  }
  return missed.sort();
}

function getStreak(code) {
  const subs = submissions[code] || {};
  let streak = 0;
  const now = new Date();
  for (let i = 1; i <= 365; i++) {
    const d = new Date(now); d.setDate(now.getDate() - i);
    const key = dateKey(d);
    const sub = subs[key];
    const has = sub && (sub.images?.length > 0 || sub.text || sub.makeupFor);
    if (has) streak++;
    else if (isMidnightPast(key)) break;
  }
  const ts = subs[todayKey()];
  if (ts && (ts.images?.length > 0 || ts.text)) streak++;
  return streak;
}

function getConsistency(code) {
  const subs = submissions[code] || {};
  const keys = Object.keys(subs).filter(k => { const s=subs[k]; return s&&(s.images?.length>0||s.text||s.makeupFor); });
  if (!keys.length) return 0;
  const firstDate = new Date(keys.sort()[0]);
  const daysSince = Math.max(1, Math.floor((new Date() - firstDate) / 86400000));
  return keys.length / daysSince;
}

function getConsecutiveMissed(code) {
  const subs = submissions[code] || {};
  let count = 0;
  const now = new Date();
  for (let i = 1; i <= 60; i++) {
    const d = new Date(now); d.setDate(now.getDate() - i);
    const key = dateKey(d);
    if (!isMidnightPast(key)) continue;
    const sub = subs[key];
    if (sub && (sub.images?.length>0||sub.text||sub.makeupFor)) break;
    else count++;
  }
  return count;
}

function getStudentStatus(code) {
  const subs = submissions[code] || {};
  const today = todayKey();
  const d = new Date(); d.setDate(d.getDate()-1); const yesterday = dateKey(d);
  const hasToday = subs[today] && (subs[today].images?.length>0||subs[today].text);
  const hasYest = subs[yesterday] && (subs[yesterday].images?.length>0||subs[yesterday].text||subs[yesterday].makeupFor);
  if (hasToday || hasYest) return 'green';
  const keys = Object.keys(subs).filter(k=>{const s=subs[k];return s&&(s.images?.length>0||s.text||s.makeupFor);});
  return keys.length === 0 ? 'grey' : 'red';
}

function getRankedStudents() { return Object.keys(STUDENTS).sort((a,b)=>getConsistency(b)-getConsistency(a)); }

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const MAX=800; let w=img.width,h=img.height;
        if(w>h&&w>MAX){h=h*MAX/w;w=MAX;}else if(h>MAX){w=w*MAX/h;h=MAX;}
        canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',0.7));
      };
      img.src=e.target.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

// ── FIREBASE ──
async function loadStudentData(code) {
  if (submissions[code]) return;
  submissions[code] = {};
  try {
    const snap = await getDocs(collection(db,'submissions',code,'days'));
    snap.forEach(d => { submissions[code][d.id] = d.data(); });
  } catch(e) { console.error('Load error',e); }
}

async function loadFlashcardProgress(code) {
  try {
    const snap = await getDoc(doc(db,'flashcards',code));
    if (snap.exists()) {
      const data = snap.data();
      fcProgress = data.progress || data || {};
      fcActivity = data.activity || {};
      fcDeletedCards = data.deleted || {};
      // Restore custom cards
      if (data.customCards) {
        Object.entries(data.customCards).forEach(([lessonNum, cards]) => {
          const num = parseInt(lessonNum);
          if (LESSONS[num]) {
            LESSONS[num].cards = [...DEFAULT_LESSONS[num]?.cards || [], ...cards];
          }
        });
      }
    } else {
      fcProgress = {}; fcActivity = {}; fcDeletedCards = {};
    }
  } catch(e) { console.error('FC load error',e); }
}

async function saveFlashcardData(code) {
  try {
    // Collect custom cards (ones beyond default count)
    const customCards = {};
    Object.entries(LESSONS).forEach(([num, lesson]) => {
      const defaultCount = DEFAULT_LESSONS[num]?.cards.length || 0;
      const extras = lesson.cards.slice(defaultCount);
      if (extras.length) customCards[num] = extras;
    });
    await setDoc(doc(db,'flashcards',code), {
      progress: fcProgress,
      activity: fcActivity,
      deleted: fcDeletedCards,
      customCards
    });
  } catch(e) { console.error('FC save error',e); }
}

// ── SUBMIT ──
async function handleSubmit() {
  const code=currentUser;
  const fileInput=document.getElementById('file-input');
  const textInput=document.getElementById('text-input');
  const files=fileInput?Array.from(fileInput.files):[];
  const text=textInput?textInput.value.trim():'';
  if(!files.length&&!text){showToast('Add a photo or write something first');return;}
  const btn=document.getElementById('submit-btn');
  btn.textContent='Uploading…';btn.disabled=true; showToast('Uploading…');
  try {
    const missed=getMissedDays(code);
    const imgs=[];
    for(const f of files){imgs.push(await fileToBase64(f));}
    const subs=submissions[code]||{};
    const todaySub=subs[selectedDate];
    const hasExisting=todaySub&&(todaySub.images?.length>0||todaySub.text);
    if(hasExisting&&missed.length>0){
      const missedDay=missed[0];
      const makeupData={images:imgs,text,reviewed:false,makeupFor:selectedDate};
      submissions[code][missedDay]=makeupData;
      await saveDay(code,missedDay,makeupData);
      showToast('Made up '+formatDateLong(missedDay)+' ✓');
    } else {
      const existing=subs[selectedDate]||{};
      const dayData={images:[...(existing.images||[]),...imgs],text:text||(existing.text||''),reviewed:false};
      submissions[code][selectedDate]=dayData;
      await saveDay(code,selectedDate,dayData);
      showToast('Homework submitted ✓');
    }
    render();
  } catch(e){showToast('Upload failed — try again');console.error(e);btn.textContent='Submit';btn.disabled=false;}
}

// ── TIMER ──
function formatTime(seconds) {
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return `${m}:${String(s).padStart(2,'0')}`;
}

function updateTimerDisplay() {
  const el = document.getElementById('fc-timer-display');
  if (!el) return;
  el.textContent = formatTime(fcTimerSecondsLeft);
  el.className = 'fc-timer-display';
  if (fcTimerRunning) el.classList.add('running');
  else if (fcTimerStarted && fcTimerSecondsLeft === 0) el.classList.add('done');
}

function startTimer() {
  if (fcTimerRunning) return;
  if (fcTimerSecondsLeft === 0) return;
  fcTimerRunning = true;
  fcTimerStarted = true;
  document.getElementById('fc-timer-start-btn').style.display = 'none';
  document.getElementById('fc-timer-stop-btn').style.display = 'inline-flex';
  fcTimerInterval = setInterval(() => {
    fcTimerSecondsLeft--;
    updateTimerDisplay();
    if (fcTimerSecondsLeft <= 0) {
      clearInterval(fcTimerInterval);
      fcTimerRunning = false;
      document.getElementById('fc-timer-start-btn').style.display = 'inline-flex';
      document.getElementById('fc-timer-stop-btn').style.display = 'none';
      onTimerEnd();
    }
  }, 1000);
  updateTimerDisplay();
}

function stopTimer() {
  if (!fcTimerRunning) return;
  clearInterval(fcTimerInterval);
  fcTimerRunning = false;
  document.getElementById('fc-timer-start-btn').style.display = 'inline-flex';
  document.getElementById('fc-timer-stop-btn').style.display = 'none';
  updateTimerDisplay();
}

function resetTimer() {
  stopTimer();
  fcTimerSecondsLeft = fcTimerGoalMinutes * 60;
  fcSessionCardsRead = 0;
  fcTimerStarted = false;
  const resultEl = document.getElementById('fc-session-result');
  if (resultEl) resultEl.style.display = 'none';
  updateTimerDisplay();
}

async function onTimerEnd() {
  // Log activity
  const today = todayKey();
  fcActivity[today] = (fcActivity[today] || 0) + fcTimerGoalMinutes;
  const code = currentUser || viewingStudent;
  await saveFlashcardData(code);
  renderCalendar();

  const resultEl = document.getElementById('fc-session-result');
  if (resultEl) {
    resultEl.style.display = 'block';
   resultEl.textContent = `✓ Session complete — ${fcTimerGoalMinutes} min added (${fcActivity[today]} min total today)`;
  }
}

// ── FLASHCARDS ──
function isCardDeleted(lessonNum, cardIdx) {
  return (fcDeletedCards[lessonNum] || []).includes(cardIdx);
}

function deleteCard(lessonNum, cardIdx) {
  if (!fcDeletedCards[lessonNum]) fcDeletedCards[lessonNum] = [];
  if (!fcDeletedCards[lessonNum].includes(cardIdx)) {
    fcDeletedCards[lessonNum].push(cardIdx);
  }
  // Remove from queue if present
  fcQueue = fcQueue.filter(c => c.idx !== cardIdx);
  if (fcCurrentIdx >= fcQueue.length) fcCurrentIdx = Math.max(0, fcQueue.length - 1);
}

function getCardProgress(lessonNum, cardIdx) {
  const key = `${lessonNum}_${cardIdx}`;
  return fcProgress[key] || { interval: 0, easeFactor: 2.5, nextReview: 0, reps: 0 };
}

function setCardProgress(lessonNum, cardIdx, data) {
  const key = `${lessonNum}_${cardIdx}`;
  fcProgress[key] = data;
}

function getDueCards(lessonNum) {
  const now = Date.now();
  const lesson = LESSONS[lessonNum];
  if (!lesson) return [];
  return lesson.cards
    .map((c,i) => ({...c, idx: i}))
    .filter(c => !isCardDeleted(lessonNum, c.idx) && getCardProgress(lessonNum, c.idx).nextReview <= now);
}

function buildFcQueue() {
  fcQueue = getDueCards(fcCurrentLesson);
  for(let i=fcQueue.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[fcQueue[i],fcQueue[j]]=[fcQueue[j],fcQueue[i]];}
  fcCurrentIdx = 0;
  fcRevealed = false;
}

// SM-2 algorithm
function applyRating(lessonNum, cardIdx, rating) {
  const p = getCardProgress(lessonNum, cardIdx);
  let { interval, easeFactor, reps } = p;
  if (rating === 1) {
    interval = 0; reps = 0;
  } else {
    if (reps === 0) interval = 1;
    else if (reps === 1) interval = 6;
    else interval = Math.round(interval * easeFactor);
    reps++;
  }
  easeFactor = Math.max(1.3, easeFactor + 0.1 - (5 - rating) * (0.08 + (5 - rating) * 0.02));
  const nextReview = Date.now() + interval * 86400000;
  setCardProgress(lessonNum, cardIdx, { interval, easeFactor, nextReview, reps });
}

function renderFlashcards() {
  // Lesson picker
  const picker = document.getElementById('fc-lesson-picker');
  picker.innerHTML='';
  Object.entries(LESSONS).forEach(([num, lesson]) => {
    const btn = document.createElement('button');
    btn.className='fc-lesson-btn'+(parseInt(num)===fcCurrentLesson?' active':'');
    btn.textContent=lesson.name;
    btn.onclick=()=>{ fcCurrentLesson=parseInt(num); buildFcQueue(); renderFlashcards(); };
    picker.appendChild(btn);
  });

  // Stats
  const lesson = LESSONS[fcCurrentLesson];
  const totalActive = lesson.cards.filter((_,i)=>!isCardDeleted(fcCurrentLesson,i)).length;
  const due = getDueCards(fcCurrentLesson).length;
  const learned = lesson.cards.filter((_,i)=>!isCardDeleted(fcCurrentLesson,i)&&getCardProgress(fcCurrentLesson,i).reps>0).length;
  const statsEl = document.getElementById('fc-stats');
  statsEl.innerHTML=`
    <div class="fc-stat"><div class="fc-stat-num">${totalActive}</div><div class="fc-stat-label">Active cards</div></div>
    <div class="fc-stat"><div class="fc-stat-num" style="color:var(--blue)">${due}</div><div class="fc-stat-label">Due today</div></div>
    <div class="fc-stat"><div class="fc-stat-num" style="color:var(--green)">${learned}</div><div class="fc-stat-label">Learned</div></div>`;

  // Timer panel wiring (re-bind after render)
  updateTimerDisplay();
  const startBtn = document.getElementById('fc-timer-start-btn');
  const stopBtn = document.getElementById('fc-timer-stop-btn');
  const resetBtn = document.getElementById('fc-timer-reset-btn');
  const rangeEl = document.getElementById('fc-timer-range');
  const goalValEl = document.getElementById('fc-timer-goal-val');

  if (startBtn) {
    startBtn.onclick = startTimer;
    stopBtn.onclick = stopTimer;
    resetBtn.onclick = resetTimer;
  }

  if (rangeEl) {
    rangeEl.value = fcTimerGoalMinutes;
    goalValEl.textContent = `${fcTimerGoalMinutes} min`;
    rangeEl.oninput = () => {
      fcTimerGoalMinutes = parseInt(rangeEl.value);
      goalValEl.textContent = `${fcTimerGoalMinutes} min`;
      if (!fcTimerRunning) {
        fcTimerSecondsLeft = fcTimerGoalMinutes * 60;
        updateTimerDisplay();
      }
    };
  }

  if (!fcQueue.length) buildFcQueue();

  const area = document.getElementById('fc-area');
  area.innerHTML='';

  if (!fcQueue.length || fcCurrentIdx >= fcQueue.length) {
    area.innerHTML=`<div class="fc-done">
      <div class="fc-done-icon">🎉</div>
      <div class="fc-done-title">All done for now!</div>
      <div class="fc-done-sub">You've reviewed all due cards. Come back tomorrow for more.</div>
      <button class="fc-restart-btn" id="fc-restart">Review all again</button>
    </div>`;
    document.getElementById('fc-restart').addEventListener('click',()=>{
      LESSONS[fcCurrentLesson].cards.forEach((_,i)=>{
        if (!isCardDeleted(fcCurrentLesson, i)) {
          const p=getCardProgress(fcCurrentLesson,i);
          setCardProgress(fcCurrentLesson,i,{...p,nextReview:0});
        }
      });
      buildFcQueue(); renderFlashcards();
    });
    return;
  }

  const card = fcQueue[fcCurrentIdx];

  const cardEl = document.createElement('div');
  cardEl.className='fc-card-wrap';
  cardEl.innerHTML=`
    <div class="fc-card" id="fc-card">
      <button class="fc-delete-btn" id="fc-delete-btn" title="Remove this card">✕</button>
      <div class="fc-arabic">${card.ar}</div>
      <div class="fc-english">${card.en}</div>
      <div class="fc-tap-hint">Tap to reveal</div>
    </div>`;
  area.appendChild(cardEl);

  const ratingWrap = document.createElement('div');
  ratingWrap.className='fc-rating-wrap';
  ratingWrap.id='fc-rating-wrap';
  ratingWrap.innerHTML=`
    <button class="fc-rating-btn fc-r1" data-r="1">1<br>Again</button>
    <button class="fc-rating-btn fc-r2" data-r="2">2<br>Hard</button>
    <button class="fc-rating-btn fc-r3" data-r="3">3<br>Good</button>
    <button class="fc-rating-btn fc-r4" data-r="4">4<br>Easy</button>
    <button class="fc-rating-btn fc-r5" data-r="5">5<br>Perfect</button>`;
  area.appendChild(ratingWrap);

  const progress = document.createElement('div');
  progress.style.cssText='text-align:center;font-size:12px;color:var(--grey);margin-top:8px';
  progress.textContent=`${fcCurrentIdx+1} / ${fcQueue.length}`;
  area.appendChild(progress);

  document.getElementById('fc-card').addEventListener('click', (e) => {
    if (e.target.id === 'fc-delete-btn') return;
    document.getElementById('fc-card').classList.add('revealed');
    document.getElementById('fc-rating-wrap').classList.add('visible');
  });

  document.getElementById('fc-delete-btn').addEventListener('click', async (e) => {
    e.stopPropagation();
    deleteCard(fcCurrentLesson, card.idx);
    const code = currentUser || viewingStudent;
    await saveFlashcardData(code);
    showToast('Card removed ✓');
    renderFlashcards();
  });

  ratingWrap.querySelectorAll('.fc-rating-btn').forEach(btn=>{
    btn.addEventListener('click',async()=>{
      const rating = parseInt(btn.dataset.r);
      applyRating(fcCurrentLesson, card.idx, rating);
      if (rating === 1) fcQueue.push(card);
      fcCurrentIdx++;
      fcSessionCardsRead++;
      const code = currentUser || viewingStudent;
      await saveFlashcardData(code);
      renderFlashcards();
    });
  });

  // Add card button
  document.getElementById('fc-add-btn').onclick = async () => {
    const ar = document.getElementById('fc-add-ar').value.trim();
    const en = document.getElementById('fc-add-en').value.trim();
    if (!ar || !en) { showToast('Enter both Arabic and English'); return; }
    const newIdx = LESSONS[fcCurrentLesson].cards.length;
    LESSONS[fcCurrentLesson].cards.push({ ar, en });
    document.getElementById('fc-add-ar').value = '';
    document.getElementById('fc-add-en').value = '';
    const code = currentUser || viewingStudent;
    await saveFlashcardData(code);
    showToast('Card added ✓');
    buildFcQueue();
    renderFlashcards();
  };
}

function exShuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function exStartTimer() {

    exTimerSeconds--;
    exUpdateTimer();
    if (exTimerSeconds <= 0) { clearInterval(exTimerInterval); exEndSession(); }
  }, 1000);
}

  const m = Math.floor(exTimerSeconds/60);
  const s = exTimerSeconds%60;
  el.textContent = m+':'+(s<10?'0':'')+s;
  el.style.color = exTimerSeconds <= 30 ? '#dc2626' : '#2563eb';
}

function exShowQuestion() {
  if (exCurrent >= exQuestions.length) {
    exQuestions = exShuffle(exMode === 'fillgap' ? [...FILL_GAP_QUESTIONS] : [...WORD_ORDER_QUESTIONS]);
    exCurrent = 0;
  }
  const revealEl = document.getElementById('ex-reveal');
  const ratingEl = document.getElementById('ex-rating-area');
  if (revealEl) revealEl.style.display = 'none';
  if (ratingEl) ratingEl.style.display = 'none';
  document.getElementById('ex-progress').textContent = 'Question '+(exAnswered+1);

  if (exMode === 'fillgap') {
    const q = exQuestions[exCurrent];
    document.getElementById('ex-instruction').textContent = 'Fill in the missing word';
    document.getElementById('ex-sentence').innerHTML = q.sentence.replace('________',
      '<span style="display:inline-block;border-bottom:3px solid #2563eb;min-width:100px;text-align:center">________</span>');
    const fillDiv = document.getElementById('ex-fill-input');
    fillDiv.style.display = 'flex';
    document.getElementById('ex-word-order').style.display = 'none';
    const inp = document.getElementById('ex-answer-input');
    inp.value = '';
    setTimeout(() => inp.focus(), 50);
    document.getElementById('ex-check-btn').onclick = exSubmitFill;
    inp.onkeydown = e => { if (e.key === 'Enter') exSubmitFill(); };
  } else {
    const q = exQuestions[exCurrent];
    document.getElementById('ex-instruction').textContent = 'Put the words in the correct order';
    document.getElementById('ex-sentence').textContent = '';
    document.getElementById('ex-fill-input').style.display = 'none';
    document.getElementById('ex-word-order').style.display = 'block';
    exWordSelected = [];
    exWordBank = exShuffle([...q.words]);
    exRenderTiles();
    document.getElementById('ex-wo-check-btn').onclick = exSubmitWordOrder;
    document.getElementById('ex-wo-clear-btn').onclick = () => { exWordSelected = []; exRenderTiles(); };
  }
}

function exRenderTiles() {
  const bank = document.getElementById('ex-word-bank');
  const ansRow = document.getElementById('ex-answer-row');
  bank.innerHTML = '';
  ansRow.innerHTML = '';
  exWordBank.forEach((word, i) => {
    if (exWordSelected.includes(i)) return;
    const btn = document.createElement('button');
    btn.className = 'ex-word-tile';
    btn.textContent = word;
    btn.onclick = () => { exWordSelected.push(i); exRenderTiles(); };
    bank.appendChild(btn);
  });
  exWordSelected.forEach((idx, pos) => {
    const btn = document.createElement('button');
    btn.textContent = exWordBank[idx];
    btn.style.cssText = 'padding:10px 16px;background:#2563eb;color:white;border:none;border-radius:10px;font-size:1.1em;cursor:pointer;direction:rtl;font-family:inherit';
    btn.onclick = () => { exWordSelected.splice(pos,1); exRenderTiles(); };
    ansRow.appendChild(btn);
  });
  if (!exWordSelected.length) {
    ansRow.innerHTML = '<span style="color:#9ca3af;font-size:14px">Your answer will appear here</span>';
  }
}

function exSubmitFill() {
  const q = exQuestions[exCurrent];
  const reveal = document.getElementById('ex-reveal');
  reveal.textContent = '✓ Answer: ' + q.answer;
  reveal.style.display = 'block';
  document.getElementById('ex-fill-input').style.display = 'none';
  const ratingEl = document.getElementById('ex-rating-area');
  ratingEl.style.display = 'flex';
  document.getElementById('ex-rate-hard').onclick = exRate;
  document.getElementById('ex-rate-med').onclick = exRate;
  document.getElementById('ex-rate-easy').onclick = exRate;
}

function exSubmitWordOrder() {
  const q = exQuestions[exCurrent];
  const reveal = document.getElementById('ex-reveal');
  reveal.innerHTML = '✓ Correct order:<br><span style="direction:rtl;display:block;margin-top:6px">'+q.answer+'</span>';
  reveal.style.display = 'block';
  document.getElementById('ex-word-order').style.display = 'none';
  const ratingEl = document.getElementById('ex-rating-area');
  ratingEl.style.display = 'flex';
  document.getElementById('ex-rate-hard').onclick = exRate;
  document.getElementById('ex-rate-med').onclick = exRate;
  document.getElementById('ex-rate-easy').onclick = exRate;
}

function exRate() {
  exAnswered++;
  exCurrent++;
  exShowQuestion();
}

async function exEndSession() {
  clearInterval(exTimerInterval);
  const dotEarned = exGoalSeconds >= 900;
  exRender(`
    <div style="text-align:center;padding:40px 20px">
      <div style="font-size:48px;margin-bottom:16px">🎉</div>
      <div style="font-size:22px;font-weight:800;color:#1a1a2e;margin-bottom:8px">Session complete!</div>
      <div style="font-size:15px;color:#6b7280;margin-bottom:24px">You answered ${exAnswered} question${exAnswered!==1?'s':''} in ${Math.round(exGoalSeconds/60)} minutes.</div>
      ${dotEarned ? '<div style="background:#f0fdf4;border:2px solid #86efac;border-radius:12px;padding:14px;margin-bottom:20px;font-size:14px;font-weight:600;color:#15803d">✓ You earned a calendar dot for today!</div>' : ''}
      <button id="ex-again-btn" style="padding:14px 32px;background:#2563eb;color:white;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer">Choose another exercise</button>
    </div>
  `);
  document.getElementById('ex-again-btn').onclick = exShowPicker;
  if (dotEarned) {
    window.dispatchEvent(new CustomEvent('ex-session-complete', { detail: { count: Math.round(exGoalSeconds / 60) } }));
  }
}

window.exShowPicker = exShowPicker;
</script>
</body>
</html>
